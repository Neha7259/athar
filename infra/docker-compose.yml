name: athar

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: athar
      POSTGRES_PASSWORD: athar_dev
      POSTGRES_DB: athar
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U athar']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: athar
      MINIO_ROOT_PASSWORD: athar_dev_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 athar athar_dev_secret &&
      mc mb --ignore-existing local/athar-evidence &&
      mc mb --ignore-existing local/athar-exports
      "

  # Placeholders — built in later sprints:
  # api:    build: ../apps/api
  # worker: build: ../apps/worker
  # web:    build: ../apps/web

volumes:
  pg-data:
  minio-data:
